<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1040" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: transparent;">
  <defs>
    <linearGradient id="client-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="header-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Arrowhead markers pointing along positive X -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
  </defs>

  <!-- ================= 1. HEADER BANNER (y = 20..80) ================= -->
  <g transform="translate(60, 20)">
    <rect width="1200" height="60" rx="14" fill="url(#header-grad2)" stroke="#334155" stroke-width="1.5" filter="url(#glow)" />
    <text x="30" y="28" fill="#f8fafc" font-size="18" font-weight="700">BidMaxxer — Service Architecture &amp; Data Interactions</text>
    <text x="30" y="47" fill="#94a3b8" font-size="12">End-to-end communication channels: Firebase Auth, Express REST APIs, MongoDB Atlas, Gemini AI &amp; Room Sync</text>
  </g>

  <!-- ================= 2. SPACED-OUT TOP OVERHEAD AUTH ROW (y = 80..200) ================= -->
  <!-- Arched route well separated from header above (y=80) and main cards below (y=205) -->
  <path d="M 220 205 C 220 120, 1120 120, 1120 205" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-amber)" />
  <rect x="525" y="106" width="270" height="28" rx="14" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2" />
  <text x="660" y="124" fill="#fbbf24" font-size="11.5" font-weight="600" text-anchor="middle">1. Google Sign-In Popup &amp; ID Token</text>


  <!-- ================= 3. COLUMN 1: CLIENT CONTAINER (x = 60..380, y = 205..785) ================= -->
  <g transform="translate(60, 205)">
    <rect width="320" height="580" rx="16" fill="url(#client-card)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)" />
    <rect width="320" height="42" rx="16" fill="#0284c7" fill-opacity="0.2" />
    <text x="20" y="27" fill="#38bdf8" font-size="15" font-weight="700">Frontend Client (Vue 3 + Vite)</text>

    <!-- Vue Views -->
    <rect x="20" y="60" width="280" height="120" rx="10" fill="#1e293b" stroke="#334155" />
    <text x="35" y="87" fill="#e2e8f0" font-size="13.5" font-weight="600">Vue 3 Views &amp; Components</text>
    <text x="35" y="112" fill="#94a3b8" font-size="12">• 16 Screens (Quiz, Planner, Bidding, Rooms)</text>
    <text x="35" y="132" fill="#94a3b8" font-size="12">• Weekly Timetable &amp; Requirement Checklist</text>
    <text x="35" y="152" fill="#94a3b8" font-size="12">• Tailwind CSS v4 + Motion Animations</text>

    <!-- Pinia Stores -->
    <rect x="20" y="200" width="280" height="175" rx="10" fill="#1e293b" stroke="#334155" />
    <text x="35" y="227" fill="#f59e0b" font-size="13.5" font-weight="600">Pinia State Stores</text>
    <text x="35" y="252" fill="#94a3b8" font-size="12">• user.js (session, completed CUs, role)</text>
    <text x="35" y="272" fill="#94a3b8" font-size="12">• quiz.js &amp; planner.js (What-If plans)</text>
    <text x="35" y="292" fill="#94a3b8" font-size="12">• bidding.js &amp; rooms.js (ballots &amp; carts)</text>
    <text x="35" y="312" fill="#94a3b8" font-size="12">• todos.js &amp; calendarExport.js</text>
    <text x="35" y="332" fill="#94a3b8" font-size="12">• catalogue.js (curriculum cache)</text>

    <!-- API Client -->
    <rect x="20" y="395" width="280" height="165" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-dasharray="3 3" />
    <text x="35" y="422" fill="#38bdf8" font-size="13.5" font-weight="600">API Client (@core/services/api.js)</text>
    <text x="35" y="447" fill="#94a3b8" font-size="12">• Injects Firebase Bearer ID Token</text>
    <text x="35" y="467" fill="#94a3b8" font-size="12">• Discards Stale Account Responses</text>
    <text x="35" y="487" fill="#94a3b8" font-size="12">• Auto token refresh on expiry</text>
    <text x="35" y="507" fill="#94a3b8" font-size="12">• Proxies /api requests to :4000</text>
  </g>


  <!-- ================= GAP 1: CLIENT -> BACKEND (x = 380..500, width = 120px) ================= -->
  <!-- Request Arrow (Client -> Backend) -->
  <path d="M 380 440 L 492 440" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <rect x="395" y="412" width="90" height="22" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="440" y="427" fill="#38bdf8" font-size="10.5" font-weight="600" text-anchor="middle">REST + Token</text>

  <!-- Response Arrow (Backend -> Client) -->
  <path d="M 500 500 L 388 500" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-blue)" />
  <rect x="395" y="508" width="90" height="22" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="440" y="523" fill="#cbd5e1" font-size="10.5" font-weight="600" text-anchor="middle">JSON Data</text>


  <!-- ================= 4. COLUMN 2: BACKEND CONTAINER (x = 500..850, y = 205..785) ================= -->
  <g transform="translate(500, 205)">
    <rect width="350" height="580" rx="16" fill="url(#client-card)" stroke="#818cf8" stroke-width="1.5" filter="url(#glow)" />
    <rect width="350" height="42" rx="16" fill="#4f46e5" fill-opacity="0.2" />
    <text x="20" y="27" fill="#a5b4fc" font-size="15" font-weight="700">Express 5 REST API (:4000/api)</text>

    <!-- Middleware -->
    <rect x="20" y="60" width="310" height="80" rx="10" fill="#1e293b" stroke="#334155" />
    <text x="35" y="85" fill="#e2e8f0" font-size="13.5" font-weight="600">Security &amp; Auth Middleware</text>
    <text x="35" y="108" fill="#94a3b8" font-size="12">• requireAuth (Firebase ID Token verification)</text>
    <text x="35" y="126" fill="#94a3b8" font-size="12">• requireAdmin (guards staff portal routes)</text>

    <!-- Feature Routers -->
    <rect x="20" y="155" width="310" height="255" rx="10" fill="#1e293b" stroke="#334155" />
    <text x="35" y="180" fill="#818cf8" font-size="13.5" font-weight="600">Feature Routers &amp; Controllers</text>
    <text x="35" y="203" fill="#94a3b8" font-size="12">• /quiz: 20-Q scoring + starter baskets</text>
    <text x="35" y="223" fill="#94a3b8" font-size="12">• /plans: What-If plans &amp; prereq audit</text>
    <text x="35" y="243" fill="#94a3b8" font-size="12">• /bidding: clash checks + reference bids</text>
    <text x="35" y="263" fill="#94a3b8" font-size="12">• /parties: collaborative rooms &amp; voting</text>
    <text x="35" y="283" fill="#94a3b8" font-size="12">• /admin: audit trail + catalogue editor</text>
    <text x="35" y="303" fill="#94a3b8" font-size="12">• /notifications: unread alert system</text>
    <text x="35" y="323" fill="#94a3b8" font-size="12">• /calendar: Google Calendar timetable export</text>
    <text x="35" y="343" fill="#94a3b8" font-size="12">• /users: student profile &amp; credit balance</text>
    <text x="35" y="363" fill="#94a3b8" font-size="12">• /modules, /tracks, /majors (catalogue)</text>

    <!-- External AI Service Wrapper -->
    <rect x="20" y="425" width="310" height="125" rx="10" fill="#1e293b" stroke="#c084fc" stroke-dasharray="3 3" />
    <text x="35" y="450" fill="#c084fc" font-size="13.5" font-weight="600">services/gemini.js</text>
    <text x="35" y="473" fill="#94a3b8" font-size="12">• Builds structured prompt with track context</text>
    <text x="35" y="493" fill="#94a3b8" font-size="12">• Low-latency JSON schema enforcement</text>
    <text x="35" y="513" fill="#94a3b8" font-size="12">• Model: gemini-3.8-flash</text>
    <text x="35" y="533" fill="#94a3b8" font-size="12">• Maps rate-limit &amp; timeout failure codes</text>
  </g>


  <!-- ================= GAP 2: BACKEND -> EXTERNAL SERVICES (x = 850..980, width = 130px) ================= -->

  <!-- 1. Backend -> Firebase Admin (y = 265) -->
  <path d="M 850 265 L 972 265" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-amber)" />
  <rect x="865" y="242" width="100" height="22" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1" />
  <text x="915" y="257" fill="#fbbf24" font-size="10.5" font-weight="600" text-anchor="middle">Verify Token</text>

  <!-- 2. Backend -> MongoDB Atlas (y = 425) -->
  <path d="M 850 425 L 972 425" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-emerald)" />
  <rect x="865" y="402" width="100" height="22" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1" />
  <text x="915" y="417" fill="#34d399" font-size="10.5" font-weight="600" text-anchor="middle">Mongoose CRUD</text>

  <!-- 3. Backend -> Google Gemini API (y = 590) -->
  <path d="M 850 590 L 972 590" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)" />
  <rect x="865" y="567" width="100" height="22" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1" />
  <text x="915" y="582" fill="#c084fc" font-size="10.5" font-weight="600" text-anchor="middle">AI Prompt</text>

  <!-- 4. Backend -> Google Calendar API (y = 730) -->
  <path d="M 850 730 L 972 730" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-rose)" />
  <rect x="865" y="707" width="100" height="22" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-width="1" />
  <text x="915" y="722" fill="#fb7185" font-size="10.5" font-weight="600" text-anchor="middle">OAuth Sync</text>


  <!-- ================= 5. COLUMN 3: EXTERNAL CLOUD SERVICES (x = 980..1260, width = 280) ================= -->

  <!-- Firebase Auth Card (y = 205..315) -->
  <g transform="translate(980, 205)">
    <rect width="280" height="110" rx="14" fill="url(#client-card)" stroke="#fbbf24" stroke-width="1.5" filter="url(#glow)" />
    <text x="20" y="28" fill="#fbbf24" font-size="14.5" font-weight="700">Firebase Authentication</text>
    <text x="20" y="54" fill="#cbd5e1" font-size="12.5">• Google Sign-In Popup Flow</text>
    <text x="20" y="74" fill="#94a3b8" font-size="12">• Issues cryptographically signed JWT</text>
    <text x="20" y="93" fill="#94a3b8" font-size="12">• Validates @smu.edu.sg domains</text>
  </g>

  <!-- MongoDB Atlas Card (y = 340..505) -->
  <g transform="translate(980, 340)">
    <rect width="280" height="165" rx="14" fill="url(#client-card)" stroke="#34d399" stroke-width="1.5" filter="url(#glow)" />
    <text x="20" y="28" fill="#34d399" font-size="14.5" font-weight="700">MongoDB Atlas (Mongoose 8)</text>
    <text x="20" y="52" fill="#cbd5e1" font-size="12">Collections:</text>
    <text x="20" y="72" fill="#94a3b8" font-size="12">• Users (profiles, completed CUs, role)</text>
    <text x="20" y="92" fill="#94a3b8" font-size="12">• Plans (semesters, courses, tracks)</text>
    <text x="20" y="112" fill="#94a3b8" font-size="12">• BidCarts, Sections &amp; Windows</text>
    <text x="20" y="132" fill="#94a3b8" font-size="12">• Parties (rooms, ballots, comments)</text>
    <text x="20" y="151" fill="#94a3b8" font-size="12">• AuditEntries (staff transactions)</text>
  </g>

  <!-- Google Gemini API Card (y = 530..645) -->
  <g transform="translate(980, 530)">
    <rect width="280" height="115" rx="14" fill="url(#client-card)" stroke="#c084fc" stroke-width="1.5" filter="url(#glow)" />
    <text x="20" y="28" fill="#c084fc" font-size="14.5" font-weight="700">Google Gemini REST API</text>
    <text x="20" y="52" fill="#cbd5e1" font-size="12.5">• Endpoint: gemini-3.8-flash</text>
    <text x="20" y="73" fill="#94a3b8" font-size="12">• Generates qualitative "Why this track"</text>
    <text x="20" y="93" fill="#94a3b8" font-size="12">• Grounded strictly in SMU course info</text>
  </g>

  <!-- Google Calendar API Card (y = 670..785) -->
  <g transform="translate(980, 670)">
    <rect width="280" height="115" rx="14" fill="url(#client-card)" stroke="#f43f5e" stroke-width="1.5" filter="url(#glow)" />
    <text x="20" y="28" fill="#fb7185" font-size="14.5" font-weight="700">Google Calendar API v3</text>
    <text x="20" y="52" fill="#cbd5e1" font-size="12.5">• Scope: calendar.events</text>
    <text x="20" y="73" fill="#94a3b8" font-size="12">• Exports recurring weekly lectures/labs</text>
    <text x="20" y="93" fill="#94a3b8" font-size="12">• Places confirmed clash-free schedule</text>
  </g>


  <!-- ================= 6. SECTION 4: PEER SYNC (y = 845..1010, width = 1200) ================= -->
  <g transform="translate(60, 845)">
    <rect width="1200" height="165" rx="16" fill="url(#client-card)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" filter="url(#glow)" />
    <text x="25" y="28" fill="#38bdf8" font-size="15" font-weight="700">Peer Collaboration &amp; Plan Room Sync (Short-Polling Architecture)</text>
    <text x="25" y="48" fill="#94a3b8" font-size="12">Friends join rooms using an invite code. Ballots synchronize every 10s via /api/parties/:id/updates; unchanged polls return HTTP 204 No Content.</text>

    <!-- Student A -->
    <g transform="translate(25, 62)">
      <rect width="350" height="85" rx="10" fill="#1e293b" stroke="#475569" />
      <text x="15" y="24" fill="#f8fafc" font-size="13" font-weight="600">Student A (Room Host)</text>
      <text x="15" y="45" fill="#94a3b8" font-size="12">Submits section votes &amp; confirmed pick</text>
      <text x="15" y="66" fill="#34d399" font-size="11.5">• Votes: G1, G2 | Confirmed: G1</text>
    </g>

    <!-- Student B -->
    <g transform="translate(425, 62)">
      <rect width="350" height="85" rx="10" fill="#1e293b" stroke="#475569" />
      <text x="15" y="24" fill="#f8fafc" font-size="13" font-weight="600">Student B (Room Member)</text>
      <text x="15" y="45" fill="#94a3b8" font-size="12">Polls room ballots and updates votes</text>
      <text x="15" y="66" fill="#34d399" font-size="11.5">• Votes: G1 | Confirmed: G1 (Overlap!)</text>
    </g>

    <!-- Co-Bidding -->
    <g transform="translate(825, 62)">
      <rect width="350" height="85" rx="10" fill="#1e293b" stroke="#818cf8" />
      <text x="15" y="24" fill="#a5b4fc" font-size="13" font-weight="600">Co-Bidding Aggregation (/api/bidding/co-bids)</text>
      <text x="15" y="45" fill="#94a3b8" font-size="12">Highlights shared section bids in realtime inside</text>
      <text x="15" y="66" fill="#fbbf24" font-size="11.5">BOSS timetable &amp; bidding simulator</text>
    </g>
  </g>

  <!-- Clean Vertical Polling Bus between Peer Sync and Backend (Direct vertical, 60px of breathing room) -->
  <path d="M 675 845 L 675 793" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-blue)" />
  <rect x="560" y="804" width="230" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="675" y="820" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">10s Short-Polling (HTTP 200 / 204)</text>

</svg>