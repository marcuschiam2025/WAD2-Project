<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auth Test Page</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; background: #fafafa; color: #222; }
    h1 { font-size: 1.3rem; }
    section { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
    h2 { font-size: 1rem; margin: 0 0 10px; }
    button { padding: 6px 12px; margin: 0 6px 6px 0; cursor: pointer; }
    input, textarea { padding: 6px; font: inherit; box-sizing: border-box; }
    textarea { width: 100%; height: 70px; font-family: monospace; }
    pre { background: #111; color: #eee; padding: 12px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; min-height: 60px; }
    .ok { color: #1a7f37; } .bad { color: #c62828; }
  </style>
</head>
<body>
  <h1>BidMaxxer auth test (temporary)</h1>

  <section>
    <h2>1. Sign in with Firebase</h2>
    <p>Status: <b id="status">loading…</b></p>
    <button id="google">Sign in with Google</button>
    <button id="microsoft">Sign in with Microsoft</button>
    <div>
      <input id="email" placeholder="test@smu.edu.sg" />
      <input id="password" type="password" placeholder="password" />
      <button id="emailLogin">Sign in with email</button>
    </div>
    <button id="logout">Sign out</button>
  </section>

  <section>
    <h2>2. Call the API (sends the Firebase token as "Authorization: Bearer …")</h2>
    <button data-call="GET /api/users/me">GET /api/users/me</button>
    <button data-call="GET /api/users/admin-check">GET /api/users/admin-check</button>
    <button id="noToken">GET /api/users/me with no token</button>
    <p>PATCH /api/users/me body (try adding "role": "admin" — it should be ignored):</p>
    <textarea id="patchBody">{ "yearOfStudy": 2, "tracks": ["BA"] }</textarea>
    <button data-call="PATCH /api/users/me">PATCH /api/users/me</button>
  </section>

  <section>
    <h2>Response</h2>
    <pre id="output">Sign in, then click a button above.</pre>
  </section>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'
    import {
      getAuth, onAuthStateChanged, signInWithPopup, signInWithEmailAndPassword, signOut,
      GoogleAuthProvider, OAuthProvider,
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'

    const $ = (id) => document.getElementById(id)
    const show = (text, ok = true) => { $('output').textContent = text; $('output').className = ok ? '' : 'bad' }

    // Load the Firebase web config from the backend (.env)
    const config = await (await fetch('/test/config')).json()
    if (!config.apiKey) {
      $('status').textContent = 'FIREBASE_WEB_API_KEY is missing from backend/.env'
      $('status').className = 'bad'
      throw new Error('missing api key')
    }
    const auth = getAuth(initializeApp(config))

    onAuthStateChanged(auth, (user) => {
      $('status').textContent = user ? `signed in as ${user.email}` : 'signed out'
      $('status').className = user ? 'ok' : ''
    })

    async function login(promise) {
      try {
        const result = await promise
        show(`Signed in to Firebase as ${result.user.email}`)
      } catch (err) {
        show(`Firebase sign-in failed: ${err.code ?? err.message}`, false)
      }
    }

    // Always show the account picker so you can choose your @smu.edu.sg Google account
    const google = new GoogleAuthProvider()
    google.setCustomParameters({ prompt: 'select_account' })
    $('google').onclick = () => login(signInWithPopup(auth, google))
    $('microsoft').onclick = () => login(signInWithPopup(auth, new OAuthProvider('microsoft.com')))
    $('emailLogin').onclick = () => login(signInWithEmailAndPassword(auth, $('email').value, $('password').value))
    $('logout').onclick = async () => { await signOut(auth); show('Signed out') }

    // Call our backend, the same way the real frontend's api.js will
    async function callApi(method, path, { withToken = true } = {}) {
      const headers = { 'Content-Type': 'application/json' }
      if (withToken) {
        if (!auth.currentUser) return show('Sign in first', false)
        headers.Authorization = `Bearer ${await auth.currentUser.getIdToken()}`
      }
      let body
      if (method === 'PATCH') {
        try { body = JSON.stringify(JSON.parse($('patchBody').value)) }
        catch { return show('PATCH body is not valid JSON', false) }
      }
      const res = await fetch(path, { method, headers, body })
      const text = await res.text()
      let pretty = text
      try { pretty = JSON.stringify(JSON.parse(text), null, 2) } catch {}
      show(`${method} ${path} → ${res.status}\n\n${pretty}`, res.ok)
    }

    document.querySelectorAll('[data-call]').forEach((btn) => {
      const [method, path] = btn.dataset.call.split(' ')
      btn.onclick = () => callApi(method, path)
    })
    $('noToken').onclick = () => callApi('GET', '/api/users/me', { withToken: false })
  </script>
</body>
</html>
